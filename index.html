<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ming &amp; Wes</title>
<style>
  :root { --bg:#faf7f2; --ink:#2b2724; --muted:#8a817a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1a18; --ink:#efe9e2; --muted:#9a918a; } }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--ink); display:grid; place-items:center;
         font-family: Georgia, "Times New Roman", serif; text-align:center; padding:0 16px; }
  h1 { font-weight:normal; font-size:clamp(2.4rem,8vw,4.5rem); margin:0; letter-spacing:.01em; }
  p { color:var(--muted); font-size:1.05rem; margin-top:.8rem; }
</style>
</head>
<body>
  <main>
    <h1>Ming &amp; Wes</h1>
    <p>Boston, MA</p>
  </main>
</body>
</html>
